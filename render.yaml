# Render Blueprint。Render ダッシュボードで「New > Blueprint」からこのリポジトリを指定すると
# 下記のサービスが作成される（Dockerfile でビルド）。
services:
  - type: web
    name: takoda99-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # 本番は --mode match（Dockerfile CMD の既定）。
    # solo モード（/ws 接続ごとに「人間1＋Bot」で即試合）はローカル確認用。
    # envVars:
    #   - key: DATABASE_URL
    #     sync: false
    #   - key: CONFIG_ADMIN_TOKEN
    #     sync: false
    #   - key: CONFIG_FRONT_ORIGIN
    #     sync: false
