name: textro99-server-ci

# 目的:
#  1. コア game のテストが常時グリーンであることを保証（コアの安全保証）
#  2. 依存ルール（game が部品/スパインを import しない等）を depguard で機械強制
#  3. 全体のビルド・テスト・vet を通す

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  core-safety:
    name: コア安全保証（game テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # コア game のテストが落ちる変更はここで止まる。マージ不可。
      - name: go test (game core)
        run: go test -race ./internal/game/...

  build-and-test:
    name: ビルド & 全体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go build
        run: go build ./...
      - name: go test (all)
        run: go test ./...
      - name: go vet
        run: go vet ./...

  arch-rules:
    name: 依存ルール検査（depguard）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # .golangci.yml の depguard で、rules の逆流 import 等を弾く。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2

  deploy-assets:
    name: デプロイ資材の検査（systemd unit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # systemd は知らないキーを見つけても【エラーにせず黙って無視する】。
      # 例: "-EnvironmentFile=" のように値に付ける "-" をキー側へ書くと、その行ごと
      # 無視されて env が一切読まれない（DATABASE_URL が渡らず内蔵デフォルトで起動する）。
      # 本番で実際に踏んだ（#83）ので、CI で拾う。
      #
      # ExecStart のバイナリはCI上に存在しないので verify 自体の終了コードは見ない。
      # "Unknown key" / "Unknown lvalue" だけを失敗条件にする。
      - name: systemd unit に無視されるキーが無いこと
        run: |
          out=$(systemd-analyze verify deploy/takoda99.service 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qiE 'unknown key|unknown lvalue'; then
            echo "::error file=deploy/takoda99.service::systemd が無視するキーがあります"
            exit 1
          fi
