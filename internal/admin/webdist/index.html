<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タコダ99 — 観測ダッシュボード</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🐙</span>
      <div class="brand-text">
        <h1>タコダ99</h1>
        <p>ライブ観測ダッシュボード</p>
      </div>
      <span id="conn-dot" class="conn-dot" data-state="connecting" title="接続状態"></span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="board" role="tab">🏪 店舗盤面</button>
      <button class="tab" data-tab="dist" role="tab">📊 スコア分布</button>
      <button class="tab" data-tab="flow" role="tab">🚶 客フロー</button>
    </nav>

    <div class="controls">
      <label class="control" id="sort-control">
        <span>並び順</span>
        <select id="sort-mode">
          <option value="rank">スコア順（強い順）</option>
          <option value="risk">切られる順（弱い順）</option>
          <option value="queue">行列が長い順</option>
          <option value="id">店ID順（固定）</option>
        </select>
      </label>
      <button id="settings-btn" class="icon-btn" title="接続設定" aria-label="接続設定">⚙</button>
    </div>
  </header>

  <!-- メトリクス帯（両タブ共通） -->
  <section class="metrics" id="metrics">
    <div class="metric metric--alive">
      <span class="metric-label">生存</span>
      <span class="metric-value"><span id="m-alive">–</span><span class="metric-sub">/<span id="m-total">99</span></span></span>
    </div>
    <div class="metric">
      <span class="metric-label">脱落</span>
      <span class="metric-value" id="m-dead">–</span>
    </div>
    <div class="metric">
      <span class="metric-label">フェーズ</span>
      <span class="metric-value metric-value--md" id="m-phase">–</span>
    </div>
    <div class="metric">
      <span class="metric-label">火力 Lv</span>
      <span class="metric-value metric-value--md" id="m-heat">–</span>
    </div>
    <div class="metric">
      <span class="metric-label">待機客</span>
      <span class="metric-value metric-value--md" id="m-rest">–</span>
    </div>
    <div class="metric metric--cull">
      <span class="metric-label">次の足切り</span>
      <span class="metric-value metric-value--md"><span id="m-cull-until">–</span><span class="metric-sub">秒</span></span>
    </div>
    <div class="metric">
      <span class="metric-label">段階</span>
      <span class="metric-value metric-value--md"><span id="m-cull-stage">–</span><span class="metric-sub">/<span id="m-cull-total">6</span></span></span>
    </div>
    <div class="metric metric--mix">
      <span class="metric-label">客の内訳</span>
      <div class="mix" id="m-mix"></div>
    </div>
    <div class="metric metric--grow">
      <span class="metric-label">決着まで</span>
      <div class="progress"><div class="progress-fill" id="m-progress"></div></div>
    </div>
    <div class="metric">
      <span class="metric-label">更新</span>
      <span class="metric-value metric-value--sm" id="m-update">–</span>
    </div>
  </section>

  <!-- 足切り予告バナー（常時表示。本戦は時刻スケジュールなので「予告中かどうか」は無い） -->
  <div id="cull" class="cull" hidden>
    <span class="cull-icon" aria-hidden="true">✂</span>
    <span class="cull-text">
      第 <b id="cull-stage">–</b>/<b id="cull-total">6</b> 段階まで <b id="cull-until">–</b> 秒
      ／ 生存 <b id="cull-target">–</b> 店まで削る
      ／ <b id="cull-line">–</b> 位より下が対象
    </span>
    <span class="cull-count" id="cull-count">–</span>
  </div>

  <main class="content">
    <!-- タブ1: 店舗盤面 -->
    <section class="view" id="view-board">
      <div id="grid" class="grid" aria-label="99店のライブ状態"></div>
    </section>

    <!-- タブ2: スコア分布（h25 の主目的。h26 のバランス調整の計測器） -->
    <section class="view" id="view-dist" hidden>
      <div class="dist-legend">
        <span class="dist-key"><i class="sw sw--human"></i>人間</span>
        <span class="dist-key"><i class="sw sw--bot"></i>Bot</span>
        <span class="dist-key"><i class="sw sw--dead"></i>脱落済み</span>
        <span class="dist-key"><i class="sw sw--cut"></i>次に切られる</span>
        <span class="dist-stat">上位<b id="d-top-n">10</b>平均 <b id="d-top">–</b></span>
        <span class="dist-stat">下位<b id="d-bottom-n">10</b>平均 <b id="d-bottom">–</b></span>
        <span class="dist-stat">分離度 <b id="d-sep" title="上位平均 − 下位平均。小さいほど団子＝足切りがタイブレーク頼みになる">–</b></span>
        <span class="dist-stat">Bot が上位<b id="d-bot-n">10</b>に <b id="d-botshare">–</b></span>
      </div>
      <div class="dist-chart" id="dist-chart" aria-label="スコア分布（順位順）">
        <div class="cutline" id="cutline" hidden><span class="cutline-tag">カットライン</span></div>
        <div class="dist-bars" id="dist-bars"></div>
      </div>
      <div class="cull-log">
        <div class="cull-log-head">足切りの履歴</div>
        <table class="cull-log-table">
          <thead><tr><th>段階</th><th>時刻</th><th>切られた数</th><th>人間</th><th>Bot</th><th>生存</th></tr></thead>
          <tbody id="cull-log-body"><tr class="cull-log-empty"><td colspan="6">まだ足切りは起きていません</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- タブ3: 客フロー -->
    <section class="view" id="view-flow" hidden>
      <div class="legend" id="legend"></div>
      <div class="waiting">
        <div class="waiting-head">
          <span class="waiting-title">たべたべエリア（待機客）</span>
          <span class="waiting-count"><b id="rest-count">0</b> 人</span>
        </div>
        <div class="waiting-pool" id="rest-pool" title="未割当の客（属性別に散らばる）"></div>
      </div>
      <div class="flow-grid" id="flow-grid" aria-label="各店の行列"></div>
    </section>

    <div id="empty" class="empty">
      <div class="empty-inner">
        <div class="empty-spinner" aria-hidden="true"></div>
        <p id="empty-msg">サーバーに接続しています…</p>
      </div>
    </div>
  </main>

  <div id="settings" class="settings" hidden>
    <div class="settings-inner">
      <label>
        <span>サーバー</span>
        <input id="server-input" type="text" placeholder="（空欄＝このページと同じサーバー）" autocomplete="off" spellcheck="false" />
      </label>
      <label>
        <span>管理トークン</span>
        <input id="token-input" type="password" placeholder="CONFIG_ADMIN_TOKEN" autocomplete="off" spellcheck="false" />
      </label>
      <div class="settings-actions">
        <button id="connect-btn" class="btn btn--primary">接続</button>
        <span class="settings-hint">URL に <code>?token=…</code> があれば自動で使います</span>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
