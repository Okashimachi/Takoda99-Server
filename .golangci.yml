# golangci-lint 設定 — takoda99-server
# 目的: 層アーキの依存ルールを機械的に強制する（docs/architecture.md）。
#   - コア game は他の internal 部品/スパインを import しない（proto は可）
#   - 層3部品（targeting/odai/config）は game/proto へ向かうのみ（スパイン参照禁止）
# 実行: golangci-lint run
#
# ※ モジュール名を takoda99 から変更したら、下の import パスも一括置換すること。

version: "2"

linters:
  enable:
    - depguard
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # ── ルール1: コア game は他の internal 部品/スパインを import しない ──
        # game が import してよいのは 標準ライブラリ・proto・game 自身のみ。
        # 部品(targeting/odai/config/bot/store)やスパイン(room/matchmaking/transport)への
        # 依存は「逆流」で設計違反。依存は常に 部品/スパイン → game の一方向。
        game-core-isolation:
          files:
            - "**/internal/game/**"
          allow:
            - "$gostd"
            - "takoda99/internal/proto"
            - "takoda99/internal/game"
          deny:
            - pkg: "takoda99/internal/targeting"
              desc: "game は作戦の具体実装を知らない。TargetingStrategy を注入して呼ぶ（DIP）。"
            - pkg: "takoda99/internal/odai"
              desc: "game はお題供給の実装を知らない。WordSource を注入して呼ぶ（DIP）。"
            - pkg: "takoda99/internal/config"
              desc: "game は設定取得を知らない。ConfigProvider を注入して呼ぶ（DIP）。"
            - pkg: "takoda99/internal/bot"
              desc: "game は bot を知らない。"
            - pkg: "takoda99/internal/store"
              desc: "game は永続化を知らない。"
            - pkg: "takoda99/internal/room"
              desc: "game はスパイン(駆動)を知らない。room が game を駆動する一方向。"
            - pkg: "takoda99/internal/matchmaking"
              desc: "game はマッチングを知らない。"
            - pkg: "takoda99/internal/transport"
              desc: "game は通信を知らない（純粋なコアに保つ）。"
            - pkg: "takoda99/internal/sim"
              desc: "game はシミュレータを知らない。sim が game を駆動する一方向。"

        # ── ルール2: コア game は I/O・通信の具象に依存しない ──
        # 純粋・Tick(dt)駆動に保ち、Goでヘッドレスにシミュレートできる状態を維持する。
        game-no-io:
          files:
            - "**/internal/game/**"
          deny:
            - pkg: "net/http"
              desc: "game はHTTPを扱わない（I/Oは transport/config の責務）。"
            - pkg: "github.com/coder/websocket"
              desc: "game はWebSocketを知らない（通信は transport 層）。"

        # ── ルール2.5: インフラ・アダプタ db は永続化ドライバを閉じ込める ──
        # internal/db は Postgres(pgx) を使ってよい唯一の場所（config/store の純粋層を汚さない）。
        # 依存の向きは内向き（game/proto/store へ）に保ち、スパイン(駆動)は参照しない。
        infra-db-boundary:
          files:
            - "**/internal/db/**"
          deny:
            - pkg: "takoda99/internal/room"
              desc: "db はスパイン(駆動)に依存しない。合成ルートが配線する。"
            - pkg: "takoda99/internal/matchmaking"
              desc: "db はマッチングに依存しない。"
            - pkg: "takoda99/internal/transport"
              desc: "db は通信層に依存しない。"

        # ── ルール2.6: HTTPアダプタ configapi は Store インターフェース越しに使う ──
        # configapi(/api/params) は game(GameParameters/Validate) と net/http のみに依存し、
        # 永続化実装(db)には依存しない（Store を注入）。スパインにも依存しない。
        http-adapters-boundary:
          files:
            - "**/internal/configapi/**"
          deny:
            - pkg: "takoda99/internal/db"
              desc: "configapi は db 実装に依存しない。Store インターフェースを合成ルートが注入する。"
            - pkg: "takoda99/internal/room"
              desc: "configapi はスパイン(駆動)に依存しない。"
            - pkg: "takoda99/internal/matchmaking"
              desc: "configapi はマッチングに依存しない。"
            - pkg: "takoda99/internal/transport"
              desc: "configapi は WS 通信層に依存しない。"

        # ── ルール2.7: シミュレータ sim は game をヘッドレスに駆動するだけ ──
        # internal/sim は game.Session を直接 tick 駆動する開発ツール（バランス調整・決着保証テスト）。
        # 実時計・通信・永続化を挟むと「1試合を数秒で」が壊れるので、スパインと db には依存させない。
        # 依存の向きは sim → game の一方向（game 側は上の game-core-isolation で sim を deny 済み）。
        sim-drives-core-only:
          files:
            - "**/internal/sim/**"
          allow:
            - "$gostd"
            - "takoda99/internal/game"
            - "takoda99/internal/proto"
            - "takoda99/internal/odai"
            - "takoda99/internal/sim"
            # typist は打ち手（Bot／ダミー店）の実力モデルだけを持つ純粋パッケージ。
            # sim と bot が**同じ判定式を共有する**ための下流（plan-h31 §5）。
            # bot 本体（Connection 越しの自動入力）は下の deny のまま。
            - "takoda99/internal/typist"
          deny:
            - pkg: "takoda99/internal/room"
              desc: "sim は room を通さない。room は実時計(ticker)で回るのでヘッドレスにならない。"
            - pkg: "takoda99/internal/transport"
              desc: "sim は通信を挟まない（99接続の性能検証は Plan-18 の負荷テストの担当）。"
            - pkg: "takoda99/internal/matchmaking"
              desc: "sim は試合の中身だけを回す。マッチングは対象外。"
            - pkg: "takoda99/internal/db"
              desc: "sim は永続化に触らない。パラメータは Config で注入する。"
            - pkg: "takoda99/internal/bot"
              desc: "sim は独自のダミー店モデルを持つ（bot は Connection 越しの自動入力で別物）。"

        # ── ルール2.8: 打ち手モデル typist は標準ライブラリだけに依存する ──
        # internal/typist は Bot（実ランタイム）と sim（ヘッドレス）の**両方から使われる**ので、
        # ここが何かを import した瞬間に依存の向きが濁る。判定式だけを置く純粋パッケージに保つ
        # （game も proto も import しない＝どちらの層からも安全に呼べる）。
        typist-pure-model:
          files:
            - "**/internal/typist/**"
          allow:
            - "$gostd"

        # ── ルール3: 層3部品は game/proto へ向かうのみ ──
        # targeting/odai/config は game(ports実装のため)・proto・標準ライブラリだけに依存する。
        # スパイン(room/matchmaking/transport)への依存は隔離を壊すため禁止。
        modules-implement-ports:
          files:
            - "**/internal/targeting/**"
            - "**/internal/odai/**"
            - "**/internal/config/**"
          allow:
            - "$gostd"
            - "takoda99/internal/game"
            - "takoda99/internal/proto"
            - "takoda99/internal/targeting"
            - "takoda99/internal/odai"
            - "takoda99/internal/config"
          deny:
            - pkg: "takoda99/internal/room"
              desc: "部品はスパイン(駆動)に依存しない。"
            - pkg: "takoda99/internal/matchmaking"
              desc: "部品はマッチングに依存しない。"
            - pkg: "takoda99/internal/transport"
              desc: "部品は通信層に依存しない。"

# 補足:
# - allow に列挙したパッケージ以外の internal 参照は、そのファイル群では原則禁止になる。
# - 新しい正当な依存を足したい時は、まず依存の向き（内向き＝gameへ向かうか）を確認してから allow に追加する。
# - game は部品(targeting/odai)を deny 側で切っている。作戦/お題は game/ports.go の interface を
#   注入して呼ぶ（DIP＝コアが継ぎ目を所有し、部品が実装する）。
